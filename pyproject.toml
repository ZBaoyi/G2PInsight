[build-system]
requires = [
    "setuptools>=65.0.0",
    "wheel>=0.37.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "G2PInsight"
version = "1.0.7"
description = "Genome-wide association analysis toolkit"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "chenrf", email = "2010288571@qq.com"}
]
keywords = [
    "GWAS",
    "genotype",
    "phenotype",
    "machine-learning",
    "SHAP",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
]
dependencies = [
    # Version-gated deps: no upper bound on requires-python (>=3.8).
    # <3.13 keeps manylinux2014 / CentOS7-friendly pins.
    # 3.13 needs numpy2/pandas2; 3.14+ needs pandas3; 3.15+ needs Pillow 12.3+.
    "numpy>=1.20,<2.0; python_version < '3.13'",
    "numpy>=2.1; python_version >= '3.13'",
    "pandas>=1.3,<2.0; python_version < '3.13'",
    "pandas>=2.2.3,<3; python_version == '3.13'",
    "pandas>=3.0; python_version >= '3.14'",
    "scikit-learn>=1.0",
    "scipy>=1.7,<2.0; python_version < '3.13'",
    "scipy>=1.14,<2.0; python_version >= '3.13'",
    "joblib>=1.0",
    "matplotlib>=3.5",
    # Pillow 12.3+ drops manylinux2014 (CentOS7); required from 3.15 for cp315 wheels.
    "Pillow>=8,<12.3; python_version < '3.15'",
    "Pillow>=12.3; python_version >= '3.15'",
    "numba>=0.57; python_version < '3.13'",
    "numba>=0.61; python_version >= '3.13'",
    "lightgbm>=3.3,<4.0.0; python_version < '3.13'",
    "lightgbm>=4.0; python_version >= '3.13'",
    "xgboost>=1.6,<2.1; python_version < '3.13'",
    "xgboost>=2.1; python_version >= '3.13'",
    "catboost>=1.0,<2.0",
    "shap>=0.40; python_version < '3.13'",
    "shap>=0.48; python_version >= '3.13'",
    "plotly>=5.0",
    # kaleido 1.x is a rewrite; plotly write_image still uses the 0.x engine API.
    "kaleido>=0.2,<1",
    "seaborn>=0.11",
    "bed-reader>=0.2",  # default fast PLINK .bed backend for preprocess
    "psutil>=5.0",
]

[project.urls]
Homepage = "https://github.com/ZBaoyi/G2PInsight"
Repository = "https://github.com/ZBaoyi/G2PInsight"
Issues = "https://github.com/ZBaoyi/G2PInsight/issues"

[project.scripts]
G2PInsight = "G2PInsight.main:main"

[tool.setuptools]
# Keep LICENSE in sdist via MANIFEST.in; do not emit License-File metadata
# (avoids twine failures on older packaging that reject that field).
license-files = []

[tool.setuptools.packages.find]
where = ["."]
include = ["G2PInsight*"]
exclude = ["G2PInsight.bin.software*"]

[tool.setuptools.package-data]
G2PInsight = [
    "bin/software/plink",
    "bin/software/gemma-0.98.5-linux-static-AMD64",
]
